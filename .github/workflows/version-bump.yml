# Ridica automat versiunea modulelor atinse de un pull request, daca autorul a
# uitat s-o ridice el.
#
# Bumpul se scrie pe branch-ul pull request-ului, ca un commit in plus, si
# tabelul de module din README.md se regenereaza odata cu el.
#
# Secretul `REGEN_PAT` (PAT classic cu scope `repo`) e pus pe organizatie,
# vizibil doar repo-urilor private, deci repo-urile private il au de-a gata.
# Unde nu ajunge -- un repo public, sau un pull request dintr-un fork, care nu
# primeste secrete si pe al carui branch nu putem scrie -- workflow-ul doar
# verifica si pica, lasand bumpul in seama autorului.
#
# Un push facut cu GITHUB_TOKEN in locul PAT-ului nu re-declanseaza
# `tests`/`pre-commit`, deci pull request-ul ar ramane fara rezultate pe varful
# nou; de aceea fara PAT nu impingem deloc.
#
# Mai cere: Settings -> Actions -> General -> "Read and write permissions".

name: version bump

on:
  pull_request:
    branches:
      - "19.0*"
    paths-ignore:
      - "**/static/description/**"
      - "**/README.rst"
      - "README.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      # `secrets` nu se poate citi direct intr-un `if`, deci intrebam o data
      # daca avem token si lucram mai departe cu raspunsul.
      - name: Can we push the bump?
        id: mode
        env:
          PAT: ${{ secrets.REGEN_PAT }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [ -n "${PAT}" ] && [ "${SAME_REPO}" = "true" ]; then
            echo "push=true" >> $GITHUB_OUTPUT
          else
            echo "push=false" >> $GITHUB_OUTPUT
            echo "::notice::Fara REGEN_PAT sau pull request din fork: doar verific versiunile."
          fi

      # Branch-ul pull request-ului, cand putem scrie pe el.
      - uses: actions/checkout@v4
        if: steps.mode.outputs.push == 'true'
        with:
          ref: ${{ github.head_ref }}
          # `bump_versions.py` compara cu baza pull request-ului.
          fetch-depth: 0
          token: ${{ secrets.REGEN_PAT }}

      # Altfel commit-ul de merge e de ajuns: doar citim.
      - uses: actions/checkout@v4
        if: steps.mode.outputs.push != 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch base branch
        run: |
          git fetch --no-tags origin \
            "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Check versions
        if: steps.mode.outputs.push != 'true'
        run: |
          python3 .github/scripts/bump_versions.py --check \
            "origin/${{ github.base_ref }}" HEAD

      - name: Bump versions
        if: steps.mode.outputs.push == 'true'
        id: bump
        run: |
          python3 .github/scripts/bump_versions.py \
            "origin/${{ github.base_ref }}" HEAD

      - name: Regenerate the addons table
        if: steps.bump.outputs.bumped != ''
        run: |
          # Fara marcajele generatorului nu avem ce regenera.
          if ! grep -q '(addons)' README.md 2>/dev/null; then
            echo "README.md nu are tabel de module; sar peste."
            exit 0
          fi
          pip install --quiet \
            "git+https://github.com/NextERP-Romania/maintainer-tools.git@2a9e0531afb2302457fc4cfd5c4a67eaef4833c0"
          oca-gen-addons-table --addons-dir . --no-commit

      - name: Commit and push
        if: steps.bump.outputs.bumped != ''
        env:
          BUMPED: ${{ steps.bump.outputs.bumped }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nimic de commis."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: bump versiuni pentru ${BUMPED}" \
            -m "Versiunile modulelor atinse de acest pull request nu fusesera ridicate; ridicate automat de workflow-ul \`version bump\`."
          git push origin "HEAD:${{ github.head_ref }}"
