<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>

  <!-- subtle decorative blobs that survive at small sizes -->
  <circle cx="220" cy="60" r="60" fill="#ffffff" opacity="0.10"/>
  <circle cx="40" cy="220" r="40" fill="#ffffff" opacity="0.07"/>

  <!-- module initials, white, dead center -->
  <text x="128" y="138"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="128"
        font-weight="800"
        fill="#ffffff"
        text-anchor="middle"
        dominant-baseline="middle"
        letter-spacing="-2">AIR</text>

  <!-- emoji badge top-right: white pill, category emoji on top -->
  <circle cx="200" cy="56" r="28" fill="#ffffff" opacity="0.95"/>
  <text x="200" y="58"
        font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif"
        font-size="32"
        text-anchor="middle"
        dominant-baseline="middle">🧾</text>

  <!-- NextERP mark at the bottom -->
  <text x="128" y="232"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="16"
        font-weight="600"
        fill="#ffffff"
        opacity="0.75"
        text-anchor="middle"
        letter-spacing="1">NextERP</text>
</svg>