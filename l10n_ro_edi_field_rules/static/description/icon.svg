<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E31E24"/>
      <stop offset="55%" stop-color="#CC0C54"/>
      <stop offset="100%" stop-color="#A81884"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>

  <!-- decorative blobs, still readable at small sizes -->
  <circle cx="222" cy="52" r="58" fill="#ffffff" opacity="0.10"/>
  <circle cx="36" cy="226" r="40" fill="#ffffff" opacity="0.07"/>

  <!-- the angle brackets of the XML the rules write into -->
  <path d="M70 92L40 128L70 164" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M186 92L216 128L186 164" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- the nodes: the middle one is the one a partner rule fills -->
  <rect x="86" y="98" width="84" height="14" rx="7" fill="#ffffff" opacity="0.40"/>
  <rect x="86" y="121" width="84" height="14" rx="7" fill="#ffffff"/>
  <rect x="86" y="144" width="60" height="14" rx="7" fill="#ffffff" opacity="0.40"/>
</svg>
